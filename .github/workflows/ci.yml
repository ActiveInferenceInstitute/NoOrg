name: NoOrg validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:coverage
        if: matrix.node-version == 24
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noorg-dist-node-${{ matrix.node-version }}
          path: dist/

  manuscript-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Install pinned manuscript tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pandoc" "$HOME/.local/bin"
          curl --fail --location --retry 3 \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/pandoc"
          curl --fail --location --retry 3 \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24/pandoc-crossref-Linux-X64.tar.xz \
            | tar -xJ -C "$HOME/.local/bin"
          install "$RUNNER_TEMP/pandoc/bin/pandoc" "$HOME/.local/bin/pandoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pandoc --version
          pandoc-crossref --version
      - run: sudo apt-get update
      - run: sudo apt-get install --yes poppler-utils texlive-xetex
      - run: npm run manuscript:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noorg-manuscript-source-evidence
          path: docs/manuscript/output/

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:text

  live-provider:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          NOORG_LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  container:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag noorg:ci .
      - run: docker run --detach --name noorg-ci --publish 3000:3000 --env NOORG_LLM_PROVIDER=local --env NOORG_HTTP_AUTH_TOKEN=ci-token noorg:ci
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ready; then exit 0; fi
            sleep 1
          done
          docker logs noorg-ci
          exit 1
      - if: always()
        run: docker rm --force noorg-ci

  # GNN pin: .github/gnn-pin.json (v5.0.3, 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1)
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned GNN parser
        run: |
          python -m pip install --disable-pip-version-check defusedxml psutil pyyaml
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          assert pin["repository"] == "ActiveInferenceInstitute/Generalized_Notation_Notation"
          assert pin["tag"] == "v5.0.3"
          assert pin["revision"] == "8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1"
          spec = (
              "generalized-notation-notation @ "
              f"git+https://github.com/{pin['repository']}.git@{pin['revision']}"
          )
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", spec]
          )
          PY
      - name: Verify pinned parser and repository sketches
        run: |
          python - <<'PY'
          import json
          import shutil
          import tempfile
          import urllib.request
          from pathlib import Path

          from gnn import __version__
          from gnn.parsers.basic import parse_gnn_formal, validate_gnn_syntax
          from gnn.type_checker import GNNTypeChecker

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          expected_version = pin["tag"].removeprefix("v")
          if __version__ != expected_version:
              raise SystemExit(f"installed GNN {__version__!r} does not match {pin['tag']!r}")

          sketches = sorted(Path(".").rglob("*.gnn.md"))
          if sketches:
              for sketch in sketches:
                  parsed = parse_gnn_formal(sketch)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit(f"{sketch} did not parse cleanly")
                  valid, errors = validate_gnn_syntax(sketch.read_text(encoding="utf-8"))
                  if not valid:
                      raise SystemExit(f"{sketch} syntax errors: {errors!r}")
              with tempfile.TemporaryDirectory(prefix="repo-gnn-") as output_dir:
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  for index, sketch in enumerate(sketches):
                      shutil.copy2(sketch, model_dir / f"{index:03d}_{sketch.name}")
                  if not GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir)):
                      raise SystemExit("GNN type checker rejected the repository sketches")
              checked = len(sketches)
              source = "repository"
          else:
              exemplar_url = (
                  "https://raw.githubusercontent.com/ActiveInferenceInstitute/"
                  "Generalized_Notation_Notation/"
                  f"{pin['revision']}/input/gnn_files/basics/static_perception.md"
              )
              with tempfile.TemporaryDirectory(prefix="pinned-exemplar-") as output_dir:
                  exemplar = Path(output_dir) / "static_perception.md"
                  urllib.request.urlretrieve(exemplar_url, exemplar)
                  parsed = parse_gnn_formal(exemplar)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit("pinned exemplar did not parse cleanly")
                  valid, errors = validate_gnn_syntax(exemplar.read_text(encoding="utf-8"))
                  if not valid:
                      raise SystemExit(f"pinned exemplar syntax errors: {errors!r}")
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  shutil.copy2(exemplar, model_dir / exemplar.name)
                  if not GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir)):
                      raise SystemExit("GNN type checker rejected the pinned exemplar")
              checked = 1
              source = "pinned-exemplar"

          print(
              json.dumps(
                  {
                      "gnn-version": __version__,
                      "pin-revision": pin["revision"],
                      "models": checked,
                      "source": source,
                      "result": "verified",
                  },
                  sort_keys=True,
              )
          )
          PY
