name: NoOrg validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node jobs run `./run.sh` arms; the arms are defined once in scripts/gate.ts and
# call the npm scripts in package.json. The container and gnn-conformance jobs run
# the same scripts their arms wrap, without installing Node dependencies. No job
# repeats an arm another job already ran, and each job installs dependencies once.

jobs:
  quality:
    name: quality (node 24)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./run.sh lint types format docs policy build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noorg-dist
          path: dist/

  test:
    name: test (node ${{ matrix.node-version }})
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Offline suites (unit and integration)
        if: matrix.node-version == 22
        run: ./run.sh test:offline
      - name: Full suite with coverage thresholds
        if: matrix.node-version == 24
        run: ./run.sh test:full

  security:
    name: security
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./run.sh security

  container:
    name: container
    timeout-minutes: 120
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same script as the container arm; this job installs no Node toolchain.
      - run: bash scripts/container-check.sh

  manuscript-source:
    name: manuscript source
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Install pinned manuscript tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pandoc" "$HOME/.local/bin"
          curl --fail --location --retry 3 \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/pandoc"
          curl --fail --location --retry 3 \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24/pandoc-crossref-Linux-X64.tar.xz \
            | tar -xJ -C "$HOME/.local/bin"
          install "$RUNNER_TEMP/pandoc/bin/pandoc" "$HOME/.local/bin/pandoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pandoc --version
          pandoc-crossref --version
      - run: sudo apt-get update
      - run: sudo apt-get install --yes poppler-utils texlive-xetex
      - run: ./run.sh manuscript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noorg-manuscript-source-evidence
          path: docs/manuscript/output/

  live-provider:
    name: live provider
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./run.sh live
        env:
          NOORG_LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # GNN pin: .github/gnn-pin.json (gnn-importer-pin/v1, v5.0.3, 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1)
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned parser dependencies
        run: python -m pip install --disable-pip-version-check defusedxml psutil pyyaml
      # Same script as the gnn arm; this job installs no Node toolchain.
      - run: python3 scripts/gnn-conformance.py
